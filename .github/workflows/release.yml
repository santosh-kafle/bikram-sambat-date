name: Release

# Stages a release on npm when a version tag (v1.2.3) is pushed, using npm
# trusted publishing: GitHub's OIDC token proves the workflow's identity, so
# no npm token is stored anywhere, and npm attaches provenance to the
# package. The version goes live only when the owner approves it with 2FA.
# The GitHub release is created as a draft, to publish after that approval.
# See RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer, and `npm stage` a newer
      # one still. Fail here, not after the tests, if the command is missing.
      - run: npm install -g npm@latest
      - run: npm stage --help > /dev/null

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run test:tz
      - run: npm run build
      - run: npm run check:package
      # The trusted publisher only allows staging. prepublishOnly runs
      # `npm run check` and the build again first.
      - run: npm stage publish

      - name: Draft the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
